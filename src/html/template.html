<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/style.css">
    <script type="module" src="../js/index.js"></script>
</head>
<body>
    <h1 id="project"></h1>
    <select name="project" id="project-list">
        <!-- options appended from index.js-->
    </select>

    <div class="todo" id="todo-list-wrapper">
        <!-- list appended from index.js -->
    </div>

    <form>
        <h3>Add Todo</h3>

        <label for="title">Title</label>
        <input type="text" name="title"></input>

        <label for="description">Description</label>
        <input type="textarea" name="description"></input>

        <label for="due_date">Due Date</label>
        <input type="text" name="due_date"></input>

        <label for="priority">Priority</label>
        <input type="checkbox" name="priority"></input>

        <button type="submit">Add Todo</button>
    </form>
</body>
</html>
