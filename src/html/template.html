<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="shell">
        <aside class="sidebar">
            <p>Todo List</p>
            <ul id="sidebar-project-list">
                <!-- options appended from index.js-->
            </ul>
        </aside>
        <main class="content">
            <header class="header">
                <h1 id="project"></h1>

                <div class="header__actions">
                    <button class="button" id="open-add-todo-btn">
                        Add Task
                    </button>
                </div>
            </header>

            <div class="todo-wrapper" id="todo-list-wrapper">
                <!-- list appended from index.js -->
            </div>

            <div class="priority" id="priority-menu" popover>
                <p>change priority</p>
                <div class="priority__choices">
                    <button class="priority__level priority__level--zero" id="testing" data-action="change-priority" data-priority="0">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M200-120v-680h360l16 80h224v400H520l-16-80H280v280h-80Zm300-440Zm86 160h134v-240H510l-16-80H280v240h290l16 80Z"/></svg>
                    </button>
                    <button class="priority__level priority__level--one" data-action="change-priority" data-priority="1">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M200-120v-680h360l16 80h224v400H520l-16-80H280v280h-80Zm300-440Zm86 160h134v-240H510l-16-80H280v240h290l16 80Z"/></svg>
                    </button> 
                    <button class="priority__level priority__level--two" data-action="change-priority" data-priority="2">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M200-120v-680h360l16 80h224v400H520l-16-80H280v280h-80Zm300-440Zm86 160h134v-240H510l-16-80H280v240h290l16 80Z"/></svg>
                    </button>
                    <button class="priority__level priority__level--three" data-action="change-priority" data-priority="3">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M200-120v-680h360l16 80h224v400H520l-16-80H280v280h-80Zm300-440Zm86 160h134v-240H510l-16-80H280v240h290l16 80Z"/></svg>
                    </button>
                </div>
            </div>
        </main>
    </div>
    <dialog id="add-todo-modal">
        <div class="modal">
            <div class="modal__header">
                <h3>Add Todo</h3>
                <button id="close-add-todo-btn">
                    X
                </button>
            </div>
            <form class="form" id="add_todo_form">
                <div class="input">
                    <label for="todo_title">Title</label>
                    <input type="text" id="todo_title" name="todo_title"></input>
                </div>

                <div class="input">
                    <label for="todo_description">Description</label>
                    <textarea id="todo_description" name="todo_description"></textarea>
                </div>

                <div class="input">
                    <label for="todo_due_date">Due Date</label>
                    <input type="date" id="todo_due_date" name="todo_due_date"></input>
                </div>

                <div class="input input--checkbox">
                    <input type="checkbox" id="todo_priority" name="todo_priority"></input>
                    <label for="todo_priority">Priority</label>
                </div>

                <button type="submit">Add Todo</button>
            </form>
        </div>
    </dialog>
</body>
</html>
